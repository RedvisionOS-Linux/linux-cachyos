name: Build Redvision OS Kernel

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на GitHub

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # Необходимо для некоторых этапов makepkg

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git wget

      - name: Setup CachyOS Repositories & Keys
        run: |
          curl https://mirror.cachyos.org/cachyos-repo.tar.xz -o cachyos-repo.tar.xz
          tar xvf cachyos-repo.tar.xz
          cd cachyos-repo
          sudo ./cachyos-repo.sh

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Makepkg Permissions
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Compile Optimized Kernel (ZSTD)
        run: |
          # 1. Принудительно отключаем подписи пакетов в pacman.conf хоста (SigLevel = Never)
          sudo sed -i 's/^SigLevel.*/SigLevel = Never/g' /etc/pacman.conf
          sudo sed -i 's/^LocalFileSigLevel.*/LocalFileSigLevel = Never/g' /etc/pacman.conf
          
          # 2. Отключаем принудительное требование GPG-подписи в конфигурации сборщика makepkg.conf
          sudo sed -i 's/BUILDENV=(.*)/BUILDENV=(!distcc !color !ccache check !sign)/g' /etc/makepkg.conf
          
          # 3. Запускаем сборку от имени пользователя builder без подписи
          sudo -u builder makepkg -s --noconfirm --nosign

      - name: Upload Compiled Packages to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pkg.tar.zst
          tag_name: "kernel-v${{ github.run_number }}"
          name: "Redvision OS Kernel v${{ github.run_number }}"
          body: "Автоматическая оптимизированная сборка ядра Redvision OS из исходников организации."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
