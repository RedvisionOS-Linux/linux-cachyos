name: Build Redvision OS Kernel

on:
  workflow_dispatch: # Позволяет запускать сборку вручную кнопкой на GitHub

jobs:
  build-kernel:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged # Необходимо для некоторых этапов makepkg

    steps:
      - name: Install System Dependencies
        run: |
          pacman -Syu --noconfirm --needed base-devel git wget

      - name: Setup CachyOS Repositories & Keys
        run: |
          curl https://cachyos.org -o cachyos-repo.tar.xz
          tar xvf cachyos-repo.tar.xz
          cd cachyos-repo
          ./cachyos-repo.sh --uninstall # Настраиваем репозитории хоста без обновления всей системы

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Configure Makepkg Permissions
        run: |
          # В Arch Linux нельзя собирать пакеты под root, создаем пользователя builder
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Compile Optimized Kernel (ZSTD)
        run: |
          # Запускаем сборку от имени пользователя builder
          sudo -u builder makepkg -s --noconfirm

      - name: Upload Compiled Packages to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            *.pkg.tar.zst
          tag_name: "kernel-v${{ github.run_number }}"
          name: "Redvision OS Kernel v${{ github.run_number }}"
          body: "Автоматическая оптимизированная сборка ядра Redvision OS из исходников организации."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
